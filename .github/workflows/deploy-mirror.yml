name: Build & Deploy ZAP Mirror Site

on:
  push:
    branches: [main, claude/sleepy-keller-qmtk7t]
  workflow_dispatch:          # allow manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate static mirror site
        env:
          PAGES_BASE_URL: https://tomer59560-dev.github.io/Dreamit
          DEFAULT_SHIPPING: '0'
          DEFAULT_DELIVERY: '3'
          DEFAULT_WARRANTY: '12 חודשים'
          DEFAULT_WARRANTY_BY: Dream It Israel
        run: node scripts/generate-static.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'chore: update mirror site [${{ github.run_number }}]'
